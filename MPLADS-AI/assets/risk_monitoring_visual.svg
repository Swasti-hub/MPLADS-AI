<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 44" width="420" height="44" fill="none">
    <!-- Clean Minimal Container -->
    <rect width="420" height="44" rx="5" fill="#FFFFFF"/>
    <rect x="0.5" y="0.5" width="419" height="43" rx="4.5" stroke="#E2E8F0" stroke-width="1"/>

    <!-- STEP 1: PROJECT DATA -->
    <g transform="translate(10, 8)">
        <!-- Data Document Icon -->
        <rect x="0" y="2" width="18" height="24" rx="2" fill="#F1F5F9" stroke="#0F2B48" stroke-width="1.6"/>
        <path d="M4 8h10M4 13h10M4 18h6" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round"/>
        <!-- Text -->
        <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0F2B48">Project Data</text>
    </g>

    <!-- ARROW 1 -->
    <g transform="translate(132, 22)">
        <path d="M0 0h16M11 -4l5 4-5 4" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- STEP 2: RISK DETECTION -->
    <g transform="translate(162, 8)">
        <!-- Risk Radar / Shield Icon -->
        <path d="M10 2L1 6v7c0 6.5 5.5 11 9 12 3.5-1 9-5.5 9-12V6l-9-4z" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
        <path d="M10 8v5" stroke="#B45309" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="10" cy="16.5" r="1.2" fill="#B45309"/>
        <!-- Text -->
        <text x="26" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#D97706">Risk Detection</text>
    </g>

    <!-- ARROW 2 -->
    <g transform="translate(290, 22)">
        <path d="M0 0h16M11 -4l5 4-5 4" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- STEP 3: INVESTIGATION -->
    <g transform="translate(320, 8)">
        <!-- Case File / Audit Icon -->
        <path d="M2 5h6l3 3h7a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="#F8FAFC" stroke="#0F2B48" stroke-width="1.5"/>
        <circle cx="14" cy="15" r="4" fill="#FFFFFF" stroke="#0F2B48" stroke-width="1.4"/>
        <path d="M17 18l3.5 3.5" stroke="#0F2B48" stroke-width="1.5" stroke-linecap="round"/>
        <!-- Text -->
        <text x="27" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#0F2B48">Investigation</text>
    </g>
</svg>