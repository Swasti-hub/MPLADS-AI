<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 44" width="420" height="44" fill="none">
    <!-- Clean Minimal Container -->
    <rect width="420" height="44" rx="5" fill="#FFFFFF"/>
    <rect x="0.5" y="0.5" width="419" height="43" rx="4.5" stroke="#E2E8F0" stroke-width="1"/>

    <!-- STEP 1: RISK FLAG -->
    <g transform="translate(12, 8)">
        <!-- Red Risk Flag -->
        <path d="M3 2v22" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
        <path d="M3 3h13l-3 4.5 3 4.5H3" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.6" stroke-linejoin="round"/>
        <!-- Text -->
        <text x="23" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#DC2626">Risk Flag</text>
        <text x="23" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">AI Deviation</text>
    </g>

    <!-- ARROW 1 -->
    <g transform="translate(130, 22)">
        <path d="M0 0h16M11 -4l5 4-5 4" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- STEP 2: EVIDENCE -->
    <g transform="translate(160, 8)">
        <!-- Document / Voucher with Checkmark -->
        <rect x="0" y="2" width="18" height="23" rx="2" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/>
        <path d="M4 7h10M4 12h10M4 17h5" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="15" cy="18" r="3.5" fill="#2563EB"/>
        <path d="M13.5 18l1 1 2-2" stroke="#FFFFFF" stroke-width="1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Text -->
        <text x="25" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#1E3A8A">Evidence</text>
        <text x="25" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="500" fill="#64748B">Vouchers &amp; Orders</text>
    </g>

    <!-- ARROW 2 -->
    <g transform="translate(280, 22)">
        <path d="M0 0h16M11 -4l5 4-5 4" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- STEP 3: OFFICER REVIEW (Human-in-the-Loop) -->
    <g transform="translate(310, 8)">
        <!-- Officer Silhouette + Verified Badge -->
        <circle cx="10" cy="7" r="5" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
        <path d="M1 23c0-4.5 4-6.5 9-6.5s9 2 9 6.5" fill="#ECFDF5" stroke="#059669" stroke-width="1.6" stroke-linecap="round"/>
        <circle cx="17" cy="18" r="4" fill="#059669"/>
        <path d="M15.5 18l1 1 2-2" stroke="#FFFFFF" stroke-width="1.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        <!-- Text -->
        <text x="26" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#059669">Officer Review</text>
        <text x="26" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="600" fill="#059669">Human-in-the-Loop</text>
    </g>
</svg>